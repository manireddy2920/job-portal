<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign Up – JobPortal</title>
  <link rel="stylesheet" href="/css/main.css" />
  <link rel="stylesheet" href="/css/auth.css" />
</head>
<body>
  <nav class="navbar">
    <div class="container nav-inner">
      <a href="/" class="brand">Job<span>Portal</span></a>
      <ul class="nav-links">
        <li><a href="/pages/jobs.html">Browse Jobs</a></li>
        <li><a href="/pages/login.html" class="btn btn-outline btn-sm">Log In</a></li>
      </ul>
    </div>
  </nav>

  <main class="auth-page">
    <div class="auth-card">
      <h1>Create your account</h1>
      <p class="auth-sub">Join thousands of job seekers and employers</p>

      <!-- Role tabs -->
      <div class="role-tabs" id="roleTabs">
        <button class="role-tab active" data-role="seeker" id="seekerTab">
          👤 Job Seeker
        </button>
        <button class="role-tab" data-role="employer" id="employerTab">
          🏢 Employer
        </button>
      </div>

      <div id="authAlert" class="alert hidden"></div>

      <form id="registerForm" novalidate>
        <input type="hidden" id="role" value="seeker" />

        <div class="form-group">
          <label for="name" id="nameLabel">Your Full Name</label>
          <input type="text" id="name" name="name" placeholder="Jane Smith" required />
          <span class="field-error" id="nameError"></span>
        </div>

        <div class="form-group" id="companyGroup" style="display:none">
          <label for="company_name">Company Name</label>
          <input type="text" id="company_name" name="company_name" placeholder="Acme Corp" />
          <span class="field-error" id="companyError"></span>
        </div>

        <div class="form-group">
          <label for="email">Email address</label>
          <input type="email" id="email" name="email" placeholder="you@example.com" required />
          <span class="field-error" id="emailError"></span>
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <div class="input-icon-wrap">
            <input type="password" id="password" name="password" placeholder="At least 6 characters" required />
            <button type="button" class="toggle-pw" id="togglePw">👁</button>
          </div>
          <span class="field-error" id="passwordError"></span>
        </div>

        <div class="form-group">
          <label for="confirmPassword">Confirm Password</label>
          <input type="password" id="confirmPassword" placeholder="Repeat your password" required />
          <span class="field-error" id="confirmError"></span>
        </div>

        <button type="submit" class="btn btn-primary btn-full" id="registerBtn">
          <span id="registerBtnText">Create Account</span>
          <span id="registerSpinner" class="btn-spinner hidden"></span>
        </button>
      </form>

      <p class="auth-footer">
        Already have an account? <a href="/pages/login.html">Log in</a>
      </p>
    </div>
  </main>

  <script src="/js/utils.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/register.js"></script>
</body>
</html>
