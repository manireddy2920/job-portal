<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Applications – JobPortal</title>
  <link rel="stylesheet" href="/css/main.css" />
  <link rel="stylesheet" href="/css/dashboard.css" />
</head>
<body>
  <nav class="navbar">
    <div class="container nav-inner">
      <a href="/" class="brand">Job<span>Portal</span></a>
      <button class="nav-toggle" aria-label="Toggle menu">&#9776;</button>
      <ul class="nav-links" id="navLinks">
        <li><a href="/pages/jobs.html">Browse Jobs</a></li>
        <li><a href="/pages/seeker-dashboard.html" class="active">My Applications</a></li>
        <li id="navProfile"><a href="/pages/profile.html">Profile</a></li>
        <li id="navLogout"><a href="#" class="btn btn-outline btn-sm" id="logoutBtn">Log Out</a></li>
      </ul>
    </div>
  </nav>

  <div class="dashboard-layout container">
    <!-- Sidebar -->
    <aside class="dash-sidebar">
      <div class="dash-user" id="dashUser">
        <div class="avatar" id="dashAvatar">?</div>
        <div>
          <strong id="dashName">–</strong>
          <small>Job Seeker</small>
        </div>
      </div>
      <nav class="dash-nav">
        <a href="#overview" class="dash-nav-link active" data-tab="overview">📊 Overview</a>
        <a href="#applications" class="dash-nav-link" data-tab="applications">📋 Applications</a>
        <a href="#profile" class="dash-nav-link" data-tab="profile">👤 Profile</a>
      </nav>
    </aside>

    <!-- Main -->
    <main class="dash-main">
      <!-- Overview Tab -->
      <section class="dash-tab active" id="tab-overview">
        <h2>Dashboard Overview</h2>
        <div class="stats-row" id="seekerStats">
          <div class="stat-card"><span id="statTotal">–</span><small>Total Applied</small></div>
          <div class="stat-card pending"><span id="statPending">–</span><small>Pending</small></div>
          <div class="stat-card shortlisted"><span id="statShortlisted">–</span><small>Shortlisted</small></div>
          <div class="stat-card hired"><span id="statHired">–</span><small>Hired</small></div>
        </div>
        <h3>Recent Applications</h3>
        <div id="recentApps" class="apps-list"><div class="loading-spinner"></div></div>
        <a href="/pages/jobs.html" class="btn btn-outline mt-2">Browse More Jobs</a>
      </section>

      <!-- Applications Tab -->
      <section class="dash-tab" id="tab-applications">
        <div class="tab-header">
          <h2>My Applications</h2>
          <div class="tab-filters">
            <select id="appStatusFilter">
              <option value="">All Statuses</option>
              <option value="pending">Pending</option>
              <option value="reviewed">Reviewed</option>
              <option value="shortlisted">Shortlisted</option>
              <option value="rejected">Rejected</option>
              <option value="hired">Hired</option>
            </select>
          </div>
        </div>
        <div id="allApps" class="apps-list"><div class="loading-spinner"></div></div>
      </section>

      <!-- Profile Tab -->
      <section class="dash-tab" id="tab-profile">
        <h2>My Profile</h2>
        <div id="profileAlert" class="alert hidden"></div>
        <form id="seekerProfileForm">
          <div class="form-row">
            <div class="form-group"><label>Full Name</label><input type="text" id="pName" /></div>
            <div class="form-group"><label>Headline</label><input type="text" id="pHeadline" placeholder="e.g. Full-Stack Developer" /></div>
          </div>
          <div class="form-row">
            <div class="form-group"><label>Phone</label><input type="tel" id="pPhone" /></div>
            <div class="form-group"><label>Location</label><input type="text" id="pLocation" placeholder="City, Country" /></div>
          </div>
          <div class="form-group"><label>Bio</label><textarea id="pBio" rows="3" placeholder="Tell employers about yourself…"></textarea></div>
          <div class="form-group"><label>Skills <small>(comma-separated)</small></label><input type="text" id="pSkills" placeholder="JavaScript, React, Node.js" /></div>
          <div class="form-group"><label>Experience</label><textarea id="pExperience" rows="4" placeholder="List your work history…"></textarea></div>
          <div class="form-group"><label>Education</label><textarea id="pEducation" rows="3" placeholder="Degrees, certifications…"></textarea></div>
          <div class="form-row">
            <div class="form-group"><label>Website</label><input type="url" id="pWebsite" /></div>
            <div class="form-group"><label>LinkedIn URL</label><input type="url" id="pLinkedin" /></div>
          </div>
          <button type="submit" class="btn btn-primary">Save Profile</button>
        </form>
      </section>
    </main>
  </div>

  <script src="/js/utils.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/seeker-dashboard.js"></script>
</body>
</html>
